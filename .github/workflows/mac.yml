name: macOS app

# Separate from CI (the README badge) because it needs a GitHub-hosted runner with Xcode 26; if that
# image isn't available yet, only this workflow is affected.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Mac checks have no per-file zone like windows/test/setup-tz.mjs yet; their shared cases use the developer's clock.
  TZ: Asia/Seoul

jobs:
  mac-app:
    name: macOS app · build + core tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1 (Swift 6.3, the toolchain the app is built with)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          swift --version
      - name: Build (debug, warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Build (release configuration, as scripts/build.sh does)
        # The same flags as the release build, in its own folder; the app bundle, the extension and signing are left out.
        env:
          PAPERTODO_APP_BUNDLE: "1"
        run: swift build -c release -Xswiftc -warnings-as-errors -Xswiftc -DPAPERTODO_RELEASE --scratch-path .build/app
      - name: Core checks (scripts/test-core.sh, the same list as the self-review)
        run: ./scripts/test-core.sh
      - name: WCAG contrast (day and night tokens)
        run: python3 scripts/check-contrast.py
      - name: Translations complete (en, nl)
        run: ./scripts/i18n/check.sh
